<text x="40" y="1468" font-size="17" font-weight="bold">Excepciones (heredan de Exception):</text>
<text x="40" y="1498" font-size="17" >Hotel lanza HabitacionOcupadaError y ReservaNoEncontradaError; DetalleEstadia lanza FechasInvalidasError.</text>
<text x="40" y="1525" font-size="16" >Triángulo: herencia. Rombo lleno: composición. Flecha simple: asociación. Se omiten constructores y propiedades.</text>
